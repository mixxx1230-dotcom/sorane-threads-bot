name: 毎日投稿（昼・夜）

on:
  schedule:
    - cron: '15 3 * * *'   # 昼 12:15 JST (UTC 3:15)
    - cron: '0 9 * * *'    # 夜 18:00 JST (UTC 9:00)
  workflow_dispatch:
    inputs:
      slot:
        description: '投稿スロット（noon または evening）'
        required: true
        default: 'noon'
        type: choice
        options:
          - noon
          - evening

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Determine slot from schedule
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ inputs.slot }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "03" ]; then
              echo "slot=noon" >> $GITHUB_OUTPUT
            else
              echo "slot=evening" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run scheduled post
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          SLOT: ${{ steps.slot.outputs.slot }}
          START_DATE: '2026-08-19'
        run: |
          cd scripts
          python3 post_scheduled.py
