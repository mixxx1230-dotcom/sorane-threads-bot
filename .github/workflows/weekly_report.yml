name: Weekly Insights Report

on:
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 0:00 UTC = 9:00 JST
  workflow_dispatch:  # 手動実行も可能

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pytrends

      - name: Generate weekly report
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/weekly_report.py

      - name: Commit AI improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts_override.json data/insights_history.json
          git diff --staged --quiet || git commit -m "auto: AI分析・インサイト蓄積 $(date +'%Y-%m-%d')"
          git push
