name: 毎日昼投稿 12:15

on:
  schedule:
    - cron: '15 3 * * *'   # 12:15 JST (UTC 3:15)
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Post noon
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          SLOT: noon
          START_DATE: '2026-08-19'
        run: cd scripts && python3 post_scheduled.py
      - name: 投稿履歴をコミット
        run: |
          git config user.email "bot@sorane-threads"
          git config user.name "Sorane Bot"
          git add data/post_history.json || true
          git diff --cached --quiet || git commit -m "投稿記録: noon $(date +%Y-%m-%d)"
          git push || true
