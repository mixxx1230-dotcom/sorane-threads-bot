name: 毎日夜投稿 18:07

on:
  schedule:
    - cron: '7 9 * * *'    # 18:07 JST (UTC 9:07)
  workflow_dispatch:

concurrency:
  group: threads-publishing
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Post evening
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          SLOT: evening
          START_DATE: '2026-08-19'
        run: cd scripts && python3 post_scheduled.py
      - name: 投稿履歴をコミット
        run: |
          git config user.email "bot@sorane-threads"
          git config user.name "Sorane Bot"
          git add data/post_history.json || true
          git diff --cached --quiet || git commit -m "投稿記録: evening $(date +%Y-%m-%d)"
          git push
