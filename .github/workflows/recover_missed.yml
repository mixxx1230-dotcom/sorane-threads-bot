name: 予定投稿の未投稿チェック

on:
  schedule:
    - cron: '47 3,4,9,10 * * *' # 12:47/13:47/18:47/19:47 JST
  workflow_dispatch:

concurrency:
  group: threads-publishing
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: 未投稿分を復旧
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          START_DATE: '2026-08-19'
        run: python3 scripts/recover_missed.py
      - name: 投稿履歴を保存
        if: always()
        run: |
          git config user.email "bot@sorane-threads"
          git config user.name "Sorane Bot"
          git add data/post_history.json || true
          git diff --cached --quiet || git commit -m "未投稿を自動復旧"
          git push
