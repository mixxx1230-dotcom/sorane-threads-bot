name: Hot Pepperブログ新着通知

on:
  schedule:
    - cron: '12 1,11 * * *' # 毎日10:12/20:12 JSTに確認
  workflow_dispatch:

concurrency:
  group: threads-publishing
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: ブログ新着を確認して告知
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          AUTOMATION_START_DATE: '2026-08-29'
        run: python3 scripts/post_blog_update.py
      - name: 最新ブログ状態を保存
        run: |
          git config user.email "bot@sorane-threads"
          git config user.name "Sorane Bot"
          git add data/hotpepper_blog_state.json || true
          git diff --cached --quiet || git commit -m "Hot Pepperブログ状態を更新"
          git push
